function makeKey() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  const hex = [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
  return `OZONA_${hex.slice(0,8)}_${hex.slice(8,12)}_${hex.slice(12,16)}_${hex.slice(16,20)}_${hex.slice(20)}`;
}
function submitAuth(form) {
  const id = form.login.value.trim();
  const pass = form.pass.value;
  authError = "";
  if (pass.length < 8) { authError = "8 caractères minimum."; render(); return; }
  if (gate === "register") {
    const email = id.toLowerCase();
    if (!email.includes("@")) { authError = "E-mail invalide."; render(); return; }
    if (form.confirm.value !== pass) { authError = "Les mots de passe ne correspondent pas."; render(); return; }
    if (db.users.some((user) => user.email === email)) { authError = "Cet e-mail est déjà utilisé."; render(); return; }
    db.users.push({ email, pass: passHash(pass) });
    db.session = { role: "client", email };
    page = "dash"; persist(); sfx("save"); render(); return;
  }
  if (gate === "manager") {
    if (id.toLowerCase() !== db.manager.username || passHash(pass) !== db.manager.pass) { authError = "Identifiant ou mot de passe incorrect."; sfx("del"); render(); return; }
    db.session = { role: "manager" };
  } else {
    const email = id.toLowerCase();
    const user = db.users.find((item) => item.email === email);
    if (!user || user.pass !== passHash(pass)) { authError = "E-mail ou mot de passe incorrect."; sfx("del"); render(); return; }
    db.session = { role: "client", email };
  }
  page = "dash"; persist(); sfx("nav"); render();
}
function luaText() {
  const c = db.config;
  const hex = c.color.replace("#", "");
  const full = hex.length === 3 ? hex.split("").map((ch) => ch + ch).join("") : hex;
  const n = parseInt(full, 16) || 0;
  return [`ConfigServ.nom = "${c.nom}"`,`ConfigServ.serverCfx = "${c.cfx}"`,`ConfigServ.maxSlots = ${Number(c.slots)}`,`ConfigServ.urldiscord = "${c.discord}"`,`ConfigServ.urlBoutique = "${c.boutique}"`,`ConfigServ.StaffInfo.logoUrl = "${c.logo}"`,`ConfigServ.DefaultMenuStyle = "${c.style}"`,`ConfigServ.DefaultMenuSize = "${c.size}"`,`ConfigServ.Color.HEX = "${c.color}"`,`ConfigServ.Color.R = ${(n >> 16) & 255}`,`ConfigServ.Color.G = ${(n >> 8) & 255}`,`ConfigServ.Color.B = ${n & 255}`,`ConfigServ.PayCheck = ${Number(c.paycheck)}`,`ConfigServ.NomDuVIP = "${c.vip}"`,`ConfigServ.drugsbuilder = ${c.drugsbuilder}`,`ConfigServ.Fiveguard = ${c.fiveguard}`].join("\n");
}
document.body.addEventListener("click", (event) => {
  const gateBtn = event.target.closest("[data-gate]");
  if (gateBtn) { gate = gateBtn.dataset.gate; authError = ""; sfx("nav"); render(); return; }
  const nav = event.target.closest("[data-page]");
  if (nav) { page = nav.dataset.page; sfx("nav"); render(); return; }
  const act = event.target.closest("[data-act]");
  if (!act) return;
  const id = Number(act.dataset.id);
  if (act.dataset.act === "logout") { db.session = null; page = "dash"; gate = "client"; authError = ""; persist(); render(); return; }
  if (act.dataset.act === "sound") { db.config.sound = !db.config.sound; persist(); sfx("nav"); render(); return; }
  if (act.dataset.act === "save") { persist("Configuration enregistrée"); return; }
  if (act.dataset.act === "export") {
    const blob = new Blob([JSON.stringify(db.config, null, 2)], { type: "application/json" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "ozona-config.json"; link.click(); sfx("save"); return;
  }
  if (act.dataset.act === "lua") { navigator.clipboard.writeText(luaText()); toast("Lua copié"); sfx("save"); return; }
  if (act.dataset.act === "copy") { navigator.clipboard.writeText(act.dataset.key); toast("Clé copiée"); sfx("nav"); return; }
  if (act.dataset.act === "add-ped") {
    db.config.pnj.push({ id: Date.now(), name: "Nouveau PNJ", model: "a_m_y_business_01", x: 215.7, y: -810.2, z: 30.7, h: 160, anim: ANIMS[0], on: true });
    sfx("nav"); render(); return;
  }
  if (act.dataset.act === "ped-del") { db.config.pnj = db.config.pnj.filter((item) => item.id !== id); sfx("del"); render(); return; }
  if (act.dataset.act === "ped-toggle") { const item = db.config.pnj.find((entry) => entry.id === id); item.on = !item.on; sfx("nav"); render(); return; }
  if (act.dataset.act === "revoke") { const item = db.licenses.find((entry) => entry.id === id); item.status = "revoked"; persist("Clé révoquée"); render(); }
});
document.body.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target;
  if (form.id === "auth") return submitAuth(form);
  if (form.id === "new-key") {
    const email = form.email.value.trim().toLowerCase();
    if (email && !db.users.some((user) => user.email === email)) { toast("Ce client n'a pas de compte"); sfx("del"); return; }
    db.licenses.unshift({ id: Date.now(), key: makeKey(), plan: form.plan.value, status: email ? "active" : "available", email, ip: "" });
    persist("Clé générée"); render(); return;
  }
  if (form.id === "redeem") {
    const key = form.key.value.trim();
    const item = db.licenses.find((entry) => entry.key === key);
    if (!item || item.status === "revoked") { toast("Clé invalide"); sfx("del"); return; }
    if (item.email && item.email !== db.session.email) { toast("Cette clé est attribuée à un autre compte"); sfx("del"); return; }
    item.email = db.session.email; item.status = "active"; persist("Licence activée"); render(); return;
  }
  if (form.id === "pass") {
    const current = passHash(form.current.value);
    const next = form.next.value;
    if (next.length < 8) { toast("8 caractères minimum"); return; }
    if (manager()) {
      if (current !== db.manager.pass) { toast("Mot de passe actuel incorrect"); sfx("del"); return; }
      db.manager.pass = passHash(next);
    } else {
      const user = client();
      if (!user || current !== user.pass) { toast("Mot de passe actuel incorrect"); sfx("del"); return; }
      user.pass = passHash(next);
    }
    persist("Mot de passe mis à jour");
  }
});
document.body.addEventListener("input", onEdit);
document.body.addEventListener("change", onEdit);
function onEdit(event) {
  const input = event.target;
  if (input.id === "q") {
    query = input.value;
    const list = document.getElementById("list");
    if (!list) return;
    const html = page === "pnj" ? pnjList() : page === "jobs" ? jobs().match(/<div id="list">([\s\S]*)<\/div>$/)?.[1] || "" : page === "users" ? users().match(/<div id="list">([\s\S]*)<\/div>$/)?.[1] || "" : "";
    if (page === "pnj") list.innerHTML = pnjList();
    else list.innerHTML = html;
    return;
  }
  if (input.dataset.k) {
    db.config[input.dataset.k] = input.dataset.bool ? input.value === "true" : input.type === "number" ? Number(input.value) : input.value;
    if (["color","nom","logo","banner"].includes(input.dataset.k)) {
      paint();
      document.querySelectorAll(".banner").forEach((el) => el.setAttribute("style", bannerStyle()));
      document.querySelectorAll(".banner b").forEach((el) => { el.textContent = db.config.nom; });
      document.querySelectorAll(".preview-logo img").forEach((img) => { if (db.config.logo) img.src = db.config.logo; });
      if (page === "dash") { const title = document.querySelector(".content h1"); if (title) title.textContent = db.config.nom; }
    }
    if (event.type === "change" && input.tagName === "SELECT") render();
    return;
  }
  const card = input.closest("[data-id]");
  if (card && input.dataset.p) {
    const item = db.config.pnj.find((entry) => entry.id === Number(card.dataset.id));
    item[input.dataset.p] = input.type === "number" ? Number(input.value) : input.value;
  }
  if (input.dataset.job) {
    const job = db.config.jobs.find((entry) => entry.id === Number(input.dataset.job));
    if (job) job.label = input.value;
  }
  if (input.dataset.jobOpen) {
    const job = db.config.jobs.find((entry) => entry.id === Number(input.dataset.jobOpen));
    if (job) job.open = input.value === "true";
  }
}
function pnjList() {
  const q = query.toLowerCase();
  return db.config.pnj.filter((item) => `${item.name} ${item.model}`.toLowerCase().includes(q)).map(pedCard).join("");
}
db = load();
if (!links().some((item) => item[0] === page)) page = "dash";
render();
</script>
