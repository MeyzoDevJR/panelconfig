<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ozona Panel</title>
<style>
  :root {
    --bg: #07080c; --side: #0c0d12; --card: #14151c; --line: rgba(255,255,255,.09);
    --text: #f6f7f9; --muted: #a4a9b3; --faint: #737884;
    --red: #dc1428; --red-2: #ff3b30; --green: #2fce73; --amber: #f5b942;
    --radius: 14px; --side-w: 220px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, "Segoe UI", sans-serif; color: var(--text); font-size: 13px;
    background:
      radial-gradient(900px 420px at 8% -10%, color-mix(in srgb, var(--red) 28%, transparent), transparent 60%),
      radial-gradient(700px 320px at 100% 0%, rgba(255,59,48,.08), transparent 50%),
      var(--bg);
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { max-width: 100%; display: block; }
  svg { width: 15px; height: 15px; flex: 0 0 15px; }
  .gate {
    min-height: 100vh; display: grid; grid-template-columns: minmax(280px, 1.08fr) minmax(320px, 460px);
    background:
      radial-gradient(640px 380px at 18% 20%, color-mix(in srgb, var(--red) 32%, transparent), transparent 62%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
      #07080c;
    background-size: auto, 48px 48px, 48px 48px, auto;
  }
  .gate-visual { position: relative; overflow: hidden; padding: 36px 42px; display: flex; flex-direction: column; justify-content: space-between; gap: 22px; }
  .orb { position: absolute; border-radius: 50%; filter: blur(8px); animation: float 9s ease-in-out infinite; pointer-events: none; }
  .orb.a { width: 180px; height: 180px; right: -40px; top: 40px; background: color-mix(in srgb, var(--red) 45%, transparent); }
  .orb.b { width: 120px; height: 120px; left: 12%; bottom: 18%; background: rgba(255,180,60,.18); animation-delay: -3s; }
  .gate-visual .brand { position: relative; z-index: 1; }
  .pitch { position: relative; z-index: 1; max-width: 460px; }
  .pitch h1 { font-size: 40px; line-height: .98; letter-spacing: -.045em; margin: 14px 0 10px; }
  .pitch p { margin: 0; color: var(--muted); font-size: 15px; max-width: 380px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .chip { border: 1px solid var(--line); background: rgba(12,13,18,.72); border-radius: 999px; padding: 5px 10px; font-size: 11px; color: #eceff4; }
  .skyline { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 7px; height: 92px; margin-top: 26px; }
  .skyline span { flex: 1; border-radius: 5px 5px 0 0; background: linear-gradient(180deg, rgba(255,255,255,.14), color-mix(in srgb, var(--red) 35%, #12080a)); position: relative; }
  .skyline span::after { content: ""; position: absolute; top: 8px; left: 7px; width: 4px; height: 4px; border-radius: 1px; background: #ffe08a; box-shadow: 12px 10px #ffe08a, 0 16px #ffe08a; animation: blink 2.8s infinite; }
  .skyline span:nth-child(2)::after { animation-delay: .4s; } .skyline span:nth-child(3)::after { animation-delay: .9s; }
  .street { height: 48px; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid var(--line); background: linear-gradient(#24262e, #24262e) center/100% 2px no-repeat, #101116; }
  .walker { position: absolute; bottom: 8px; width: 10px; height: 16px; border-radius: 4px 4px 2px 2px; background: var(--red-2); animation: walk 7s linear infinite; }
  .walker::before, .walker::after { content: ""; position: absolute; bottom: -6px; width: 3px; height: 7px; background: #f3f3f5; border-radius: 2px; animation: step .35s ease-in-out infinite alternate; }
  .walker::after { right: 0; animation-delay: .18s; }
  .feats { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .feat { background: rgba(12,13,18,.78); border: 1px solid var(--line); border-radius: 12px; padding: 10px; backdrop-filter: blur(8px); }
  .feat b { display: block; margin-bottom: 2px; }
  .feat span, .hint, .sub, .brand span { color: var(--muted); }
  .gate-pane { display: grid; place-items: center; padding: 28px 22px; }
  .gate-card {
    width: min(400px, 100%); background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.02));
    border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 22px 20px 16px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), 0 0 0 1px color-mix(in srgb, var(--red) 25%, transparent);
    animation: rise .35s ease;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .mark {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(160deg, var(--red-2), #7a0c08);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 18%, transparent);
    animation: pulse 2.8s ease-in-out infinite;
  }
  .brand strong { display: block; font-size: 13px; }
  .brand span { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .gate-card h2 { font-size: 22px; margin: 16px 0 4px; letter-spacing: -.03em; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }
  .tabs button, .btn, .btn-line, .ghost, .nav { border-radius: 9px; border: 1px solid var(--line); background: #1b1d24; }
  .tabs button { padding: 8px; background: transparent; }
  .tabs button.on { background: linear-gradient(180deg, var(--red-2), #9d120c); border-color: transparent; color: white; font-weight: 700; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field span, .switcher span { color: var(--muted); font-size: 11px; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field.full { grid-column: 1 / -1; }
  .stack-form { display: flex; flex-direction: column; gap: 8px; }
  .error { color: #ff8d86; font-size: 12px; min-height: 16px; margin: 2px 0 0; }
  .btn, .btn-line { padding: 8px 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary, .btn-primary { background: linear-gradient(180deg, var(--red-2), #9d120c); border-color: transparent; color: white; font-weight: 700; box-shadow: 0 8px 20px color-mix(in srgb, var(--red) 28%, transparent); }
  .btn.wide { width: 100%; }
  .btn-line { background: transparent; }
  .btn.danger { background: transparent; color: #ffb4ae; border-color: rgba(220,20,40,.5); }
  .btn:active, .nav:active, .icon-btn:active { transform: scale(.98); }
  .switch { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
  .switch button { border: 0; background: transparent; color: white; font-weight: 700; padding: 0; }
  .app { display: flex; min-height: 100vh; }
  .side {
    width: var(--side-w); flex: 0 0 var(--side-w); background: rgba(12,13,18,.96); border-right: 1px solid var(--line);
    padding: 14px 10px 10px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: auto;
  }
  .nav-label { margin: 12px 8px 4px; color: color-mix(in srgb, var(--red-2) 75%, white); font-size: 10px; letter-spacing: .14em; font-weight: 800; }
  .nav { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; color: #c9ccd3; text-align: left; padding: 7px 8px; }
  .nav.active { background: color-mix(in srgb, var(--red) 18%, #1c1e25); color: white; box-shadow: inset 2px 0 0 var(--red-2); }
  .nav:hover, .ghost:hover { background: #1c1e25; color: white; }
  .nav.active svg { color: var(--red-2); }
  .foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; padding-top: 10px; }
  .ghost { display: flex; align-items: center; gap: 8px; background: transparent; border: 0; color: #c5c7ce; text-align: left; padding: 7px 8px; }
  .badge { margin: 6px 8px 0; width: fit-content; border: 1px solid color-mix(in srgb, var(--red) 55%, transparent); color: #ffb4ae; border-radius: 999px; font-size: 9px; letter-spacing: .12em; padding: 3px 7px; font-weight: 800; }
  .badge.ok { border-color: rgba(47,206,115,.45); color: var(--green); }
  .main, .content, .grid, .stack, .card, .fields, .field { min-width: 0; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .top { min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .crumb { color: var(--muted); min-width: 140px; }
  .crumb b { color: var(--text); font-weight: 650; }
  .switcher { display: flex; flex-direction: column; gap: 2px; min-width: 210px; }
  .search { flex: 1; display: flex; justify-content: center; min-width: 140px; }
  .search input { width: min(260px, 100%); background: #101117; border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; outline: none; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: block; }
  .live.ping i { animation: ping .45s ease; }
  .avatar { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: linear-gradient(160deg, var(--red-2), #6e0d09); }
  .mobile-nav { display: none; }
  .content { padding: 16px 18px 86px; animation: rise .28s ease; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; margin-bottom: 12px; }

  .stack { display: flex; flex-direction: column; gap: 10px; }

  .card h2 { margin: 0; font-size: 14px; }

  .ok { color: var(--green); } .warn { color: var(--amber); }

    display: flex; gap: 10px; align-items: flex-start; padding: 10px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 12px; background: #101116;
  }

  .scope b, .person b, .srv b { display: block; }

  .grow { flex: 1; min-width: 0; }
  .preview-logo, .banner { border: 1px solid var(--line); border-radius: 10px; background: #0d0e12; overflow: hidden; }
  .preview-logo { height: 72px; display: grid; place-items: center; padding: 8px; }

  .banner { height: 78px; display: flex; align-items: flex-end; padding: 8px 10px; background-size: cover; background-position: center; position: relative; }
  .banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(0,0,0,.58)); }
  .banner b, .banner span { position: relative; z-index: 1; }
  .banner span { display: block; color: #eee; font-size: 11px; }
  .menu-mock { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #101116; }
  .menu-item { padding: 7px 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
  .menu-item.on { background: color-mix(in srgb, var(--red) 32%, #15161c); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .pnj { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: #101116; margin-bottom: 6px; }
  .pnj.off, .person.off { opacity: .5; }
  .dot { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--red) 18%, #15161c); color: var(--red-2); }
  .key { font-family: Consolas, monospace; font-size: 12px; word-break: break-all; }
  .tag { border-radius: 999px; padding: 2px 7px; font-size: 11px; background: #2a2416; color: var(--amber); }
  .tag.live { background: rgba(47,206,115,.14); color: var(--green); }
  .tag.dead { background: #2a1518; color: #ffb4ae; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); padding: 4px; border-radius: 6px; }
  .icon-btn:hover { background: #22242c; color: white; }
  .swatch { height: 36px; padding: 2px; }
  .bar {
    position: fixed; z-index: 4; left: calc(var(--side-w) + 12px); right: 12px; bottom: 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: rgba(12,13,18,.94); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
    backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,.28);
  }
  .bar[hidden] { display: none; }
  .toast { position: fixed; right: 16px; bottom: 72px; background: #17181f; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; opacity: 0; transform: translateY(8px); transition: .25s ease; pointer-events: none; z-index: 5; }
  .toast.show { opacity: 1; transform: none; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--red) 8%, transparent); } }
  @keyframes walk { from { left: -16px; } to { left: 100%; } }
  @keyframes step { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
  @keyframes float { 50% { transform: translateY(14px); } }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes ping { 50% { box-shadow: 0 0 0 6px transparent; } }
  @media (max-width: 900px) {
    .gate { grid-template-columns: 1fr; }
    .gate-visual { padding: 22px 18px 6px; }
    .pitch h1 { font-size: 30px; }
    .feats, .skyline { display: none; }
    .side { display: none; }
    .mobile-nav { display: flex; gap: 6px; overflow: auto; padding: 8px 10px; border-bottom: 1px solid var(--line); }

    .stats.four { grid-template-columns: 1fr 1fr; }
    .bar { left: 12px; }
  }
</style>

function makeKey() {
  const bytes = new Uint8Array(16);
  crypto.getRandomValues(bytes);
  const hex = [...bytes].map((b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
  const prefix = String(db.keyShop.prefix || "OZONA").toUpperCase().replace(/[^A-Z0-9]/g, "") || "OZONA";
  return `${prefix}_${hex.slice(0, 8)}_${hex.slice(8, 12)}_${hex.slice(12, 16)}_${hex.slice(16, 20)}_${hex.slice(20)}`;
}
function findUser(email) { return db.users.find((user) => user.email === email); }
function submitAuth(form) {
  const id = form.login.value.trim();
  const pass = form.pass.value;
  authError = "";
  if (pass.length < 8) { authError = "8 caractères minimum."; render(); return; }
  if (gate === "register") {
    const email = id.toLowerCase();
    if (!email.includes("@")) { authError = "E-mail invalide."; render(); return; }
    if (form.confirm.value !== pass) { authError = "Les mots de passe ne correspondent pas."; render(); return; }
    if (db.users.some((user) => user.email === email)) { authError = "Cet e-mail est déjà utilisé."; render(); return; }
    db.users.push(blankUser(email, pass));
    db.session = { role: "client", email };
    page = "dash"; persist(); sfx("save"); render(); return;
  }
  if (gate === "manager") {
    if (id.toLowerCase() !== db.manager.username || passHash(pass) !== db.manager.pass) { authError = "Identifiant ou mot de passe incorrect."; sfx("del"); render(); return; }
    db.session = { role: "manager" };
  } else {
    const email = id.toLowerCase();
    const user = db.users.find((item) => item.email === email);
    if (!user || user.pass !== passHash(pass)) { authError = "E-mail ou mot de passe incorrect."; sfx("del"); render(); return; }
    if (user.disabled) { authError = "Ce compte est coupé par le manager."; sfx("del"); render(); return; }
    db.session = { role: "client", email };
  }
  page = "dash"; persist(); sfx("nav"); render();
}
function luaQuote(value) { return `"${String(value ?? "").replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`; }
function luaText() {
  const c = cfg();
  const hex = String(c.color || "#dc1428").replace("#", "");
  const full = hex.length === 3 ? hex.split("").map((ch) => ch + ch).join("") : hex;
  const n = parseInt(full, 16) || 0;
  const lines = {
    nom: c.nom, serverCfx: c.cfx, maxSlots: Number(c.slots), urldiscord: c.discord, urlBoutique: c.boutique,
    "StaffInfo.logoUrl": c.logo, DefaultMenuStyle: c.style, DefaultMenuSize: c.size, "Color.HEX": c.color,
    "Color.R": (n >> 16) & 255, "Color.G": (n >> 8) & 255, "Color.B": n & 255, PayCheck: Number(c.paycheck),
    NomDuVIP: c.vip, drugsbuilder: !!c.drugsbuilder, Fiveguard: !!c.fiveguard, Motd: c.motd, Welcome: c.welcome,
    Maintenance: !!c.maintenance, Whitelist: !!c.whitelist, Color2: c.color2, Hud: c.hud, Loadscreen: c.loadscreen,
    SpawnX: Number(c.spawnX), SpawnY: Number(c.spawnY), SpawnZ: Number(c.spawnZ), Tax: Number(c.tax),
    InvWeight: Number(c.invWeight), MaxVehicles: Number(c.maxVehicles), VipPay: Number(c.vipPay), Restart: c.restart
  };
  return Object.entries(lines).map(([key, value]) => `ConfigServ.${key} = ${typeof value === "number" || typeof value === "boolean" ? value : luaQuote(value)}`).join("\n");
}

  if (name === "logout") { db.session = null; db.focus = null; page = "dash"; gate = "client"; authError = ""; persist(); render(); return; }
  if (!manager() && ["backup","focus","open-server","key-for","revoke","restore","renew","reset-ip","key-del","disable","wipe","copy-atelier","user-del"].includes(name)) return;
  if (name === "sound") { db.ui.sound = !db.ui.sound; persist(); sfx("nav"); render(); return; }
  if (name === "export") {
    const blob = new Blob([JSON.stringify(cfg(), null, 2)], { type: "application/json" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "ozona-config.json"; link.click(); sfx("save"); return;
  }
  if (name === "backup") {
    const copy = clone(db);
    delete copy.manager.pass; delete copy.session;
    copy.users.forEach((user) => { delete user.pass; });
    const blob = new Blob([JSON.stringify(copy, null, 2)], { type: "application/json" });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "ozona-base.json"; link.click(); sfx("save"); return;
  }
  if (name === "lua") { navigator.clipboard.writeText(luaText()); toast("Lua copié"); sfx("save"); return; }
  if (name === "copy") { navigator.clipboard.writeText(act.dataset.key); toast("Clé copiée"); sfx("nav"); return; }
  if (name === "focus" || name === "open-server") { sfx("nav"); setFocus(email); return; }
  if (name === "key-for") { prefill = email; page = "keys"; sfx("nav"); render(); return; }
  if (name === "add-ped") {
    cfg().pnj.push({ id: Date.now(), name: "Nouveau PNJ", model: "a_m_y_business_01", x: 215.7, y: -810.2, z: 30.7, h: 160, anim: ANIMS[0], on: true });
    persist(); sfx("nav"); render(); return;
  }
  if (name === "add-job") { cfg().jobs.push({ id: Date.now(), label: "Nouveau métier", open: true }); persist(); sfx("nav"); render(); return; }
  if (name === "ped-del") { cfg().pnj = cfg().pnj.filter((item) => item.id !== id); persist(); sfx("del"); render(); return; }
  if (name === "job-del") { cfg().jobs = cfg().jobs.filter((item) => item.id !== id); persist(); sfx("del"); render(); return; }
  if (name === "ped-toggle") { const item = cfg().pnj.find((entry) => entry.id === id); if (item) item.on = !item.on; persist(); sfx("nav"); render(); return; }
  if (name === "revoke") { const item = db.licenses.find((entry) => entry.id === id); if (item) item.status = "revoked"; persist("Clé révoquée"); render(); return; }
  if (name === "restore") { const item = db.licenses.find((entry) => entry.id === id); if (item) item.status = item.email ? "active" : "available"; persist("Clé rétablie"); render(); return; }
  if (name === "renew") { const item = db.licenses.find((entry) => entry.id === id); if (item) { item.activated = Date.now(); if (item.status !== "revoked") item.status = "active"; } persist("Durée relancée"); render(); return; }
  if (name === "reset-ip") {
    const item = db.licenses.find((entry) => entry.id === id);
    if (item) {
      item.ip = "";
      fetch(apiBase() + "/api/v1/reset-ip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: item.key }) }).catch(() => {});
    }
    persist("IP libérée"); render(); return;
  }
  if (name === "key-del") {
    if (!confirm("Supprimer cette clé ?")) return;
    db.licenses = db.licenses.filter((item) => item.id !== id); persist("Clé supprimée"); sfx("del"); render(); return;
  }
  if (name === "disable") { const user = findUser(email); if (user) user.disabled = !user.disabled; persist(user && user.disabled ? "Compte coupé" : "Compte rétabli"); render(); return; }
  if (name === "wipe") { db.licenses.forEach((item) => { if (item.email === email) item.status = "revoked"; }); persist("Clés révoquées"); render(); return; }
  if (name === "copy-atelier") { const user = findUser(email); if (user) user.server = clone(db.config); persist("Atelier copié sur ce serveur"); render(); return; }
  if (name === "user-del") {
    if (!confirm("Supprimer ce compte client ?")) return;
    db.users = db.users.filter((user) => user.email !== email);
    if (db.focus === email) db.focus = null;
    persist("Compte supprimé"); sfx("del"); render();
  }
});
document.body.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target;
  if (form.id === "auth") return submitAuth(form);
  if (form.id === "new-key") {
    const email = form.email.value.trim().toLowerCase();
    if (email && !findUser(email)) { toast("Ce client n'a pas de compte"); sfx("del"); return; }
    if (!email && !db.keyShop.allowOpen) { toast("Une attribution est obligatoire"); sfx("del"); return; }
    if (email && db.licenses.filter((item) => item.email === email && item.status !== "revoked").length >= Number(db.keyShop.maxPerClient)) { toast("Plafond de clés atteint"); sfx("del"); return; }
    db.licenses.unshift({ id: Date.now(), key: makeKey(), plan: form.plan.value, status: email ? "active" : "available", email, ip: "", activated: email ? Date.now() : null });
    prefill = ""; persist("Clé générée"); render(); return;
  }
  if (form.id === "new-user") {
    const email = form.email.value.trim().toLowerCase();
    if (!email.includes("@") || form.pass.value.length < 8) { toast("E-mail ou mot de passe invalide"); sfx("del"); return; }
    if (form.confirm.value !== form.pass.value) { toast("Les mots de passe ne correspondent pas"); sfx("del"); return; }
    if (findUser(email)) { toast("Cet e-mail existe déjà"); sfx("del"); return; }
    db.users.push(blankUser(email, form.pass.value, form.city.value.trim()));
    persist("Compte client créé"); render(); return;
  }
  if (form.classList.contains("reset-pass")) {
    const user = findUser(form.dataset.email);
    if (!user || form.pass.value.length < 8) { toast("8 caractères minimum"); sfx("del"); return; }
    user.pass = passHash(form.pass.value);
    persist("Mot de passe du client mis à jour"); form.reset(); return;
  }
  if (form.id === "redeem") {
    const key = form.key.value.trim();
    const item = db.licenses.find((entry) => entry.key === key);
    if (!item || item.status === "revoked") { toast("Clé invalide"); sfx("del"); return; }
    if (item.email && item.email !== db.session.email) { toast("Cette clé est attribuée à un autre compte"); sfx("del"); return; }
    item.email = db.session.email; item.status = "active"; item.activated = item.activated || Date.now();
    persist("Licence activée"); render(); return;
  }
  if (form.id === "ident") {
    const username = form.username.value.trim().toLowerCase();
    if (!/^[a-z0-9._-]{3,24}$/.test(username)) { toast("Identifiant : 3 à 24 caractères"); sfx("del"); return; }
    if (passHash(form.current.value) !== db.manager.pass) { toast("Mot de passe actuel incorrect"); sfx("del"); return; }
    db.manager.username = username; db.manager.name = form.name.value.trim() || username;
    persist("Compte manager mis à jour"); render(); return;
  }
  if (form.id === "pass") {
    const current = passHash(form.current.value);
    const next = form.next.value;
    if (next.length < 8) { toast("8 caractères minimum"); return; }
    if (manager()) {
      if (current !== db.manager.pass) { toast("Mot de passe actuel incorrect"); sfx("del"); return; }
      db.manager.pass = passHash(next);
    } else {
      const user = client();
      if (!user || current !== user.pass) { toast("Mot de passe actuel incorrect"); sfx("del"); return; }
      user.pass = passHash(next);
    }
    persist("Mot de passe mis à jour"); form.reset();
  }
});
document.body.addEventListener("input", onEdit);
document.body.addEventListener("change", onEdit);
function readValue(input) {
  if (input.dataset.bool) return input.value === "true";
  if (input.type === "number" || input.dataset.num) return Number(input.value);
  return input.value;
}
function onEdit(event) {
  const input = event.target;
  if (input.tagName === "SELECT" && event.type !== "change") return;
  if (event.type === "change" && input.tagName !== "SELECT" && input.type !== "color") return;
  if (input.id === "q") {
    query = input.value;
    const list = document.getElementById("list");
    if (!list) return;
    const html = { pnj: pnjList, jobs: jobsList, users: usersList, keys: keysList, servers: () => serverRoster().join("") }[page];
    if (html) list.innerHTML = html();
    return;
  }
  if (input.id === "focus") { db.focus = input.value || null; persist(); render(); return; }
  if (input.dataset.k) {
    cfg()[input.dataset.k] = readValue(input);
    if (["color","color2","nom","logo","banner","motd"].includes(input.dataset.k)) {
      paint();
      document.querySelectorAll(".banner").forEach((el) => el.setAttribute("style", bannerStyle()));
      document.querySelectorAll("[data-bind]").forEach((el) => { el.textContent = cfg()[el.dataset.bind] ?? ""; });
      document.querySelectorAll(".preview-logo img").forEach((img) => { if (cfg().logo) img.src = cfg().logo; });
    }
    if (input.tagName === "SELECT") { persist(); render(); }
    else liveSave();
    return;
  }
  if (input.dataset.shop) {
    db.keyShop[input.dataset.shop] = readValue(input);
    if (input.tagName === "SELECT") { persist(); render(); } else liveSave();
    return;
  }
  const box = input.closest("[data-id]");
  if (box && input.dataset.p) {
    const item = cfg().pnj.find((entry) => entry.id === Number(box.dataset.id));
    if (item) item[input.dataset.p] = input.type === "number" ? Number(input.value) : input.value;
    if (input.tagName === "SELECT") { persist(); render(); } else liveSave();
    return;
  }
  if (input.dataset.job) {
    const job = cfg().jobs.find((entry) => entry.id === Number(input.dataset.job));
    if (job) job.label = input.value;
    liveSave();
  }
  if (input.dataset.jobOpen) {
    const job = cfg().jobs.find((entry) => entry.id === Number(input.dataset.jobOpen));
    if (job) job.open = input.value === "true";
    persist();
  }
  if (input.dataset.user) {
    const user = findUser(input.dataset.user);
    if (user) user.note = input.value;
    liveSave();
  }
  if (input.dataset.licEmail || input.dataset.licPlan) {
    const item = db.licenses.find((entry) => entry.id === Number(input.dataset.licEmail || input.dataset.licPlan));
    if (!item) return;
    if (input.dataset.licEmail) {
      item.email = input.value;
      if (item.email && item.status === "available") { item.status = "active"; item.activated = item.activated || Date.now(); }
      if (!item.email && item.status === "active") item.status = "available";
    }
    if (input.dataset.licPlan) item.plan = input.value;
    persist("Clé mise à jour"); render();
  }
}
db = load();
render();
</script>
